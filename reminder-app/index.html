<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作备忘 - WorkMemo</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <nav class="sidebar">
      <div class="logo">
        <span class="logo-icon">📋</span>
        <h1>工作备忘</h1>
      </div>
      <ul class="nav-links">
        <li><a href="#today" class="nav-link active">📅 今日待办</a></li>
        <li><a href="#weekly" class="nav-link">📆 周视图</a></li>
        <li><a href="#tasks" class="nav-link">📝 全部任务</a></li>
        <li><a href="#settings" class="nav-link">⚙️ 设置</a></li>
      </ul>
      <button class="btn-add" id="btn-add-task">+ 新建任务</button>
    </nav>
    <main id="main-content">
      <div id="view-today" class="view active-view"></div>
      <div id="view-weekly" class="view"></div>
      <div id="view-tasks" class="view"></div>
      <div id="view-settings" class="view"></div>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal-content"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
